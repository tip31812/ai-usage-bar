name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: ./build.sh
      - name: Hooks syntax check
        run: python3 -m py_compile hooks/*.py
      - name: Check universal binary
        run: lipo -archs build.noindex/AI額度看板.app/Contents/MacOS/QuotaBar | tee /dev/stderr | grep -q arm64 && lipo -archs build.noindex/AI額度看板.app/Contents/MacOS/QuotaBar | grep -q x86_64
      - name: Render demo snapshots (smoke test, zh + en)
        run: |
          B=build.noindex/AI額度看板.app/Contents/MacOS/QuotaBar
          $B --snapshot out-zh.png --demo --lang zh && test -s out-zh.png
          $B --snapshot out-en.png --demo --lang en && test -s out-en.png
